name: Roll back Hermes v2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select the preceding production revision or an explicit revision
        required: true
        type: choice
        options:
          - rollback-previous
          - rollback-revision
      rollback_revision:
        description: Existing sha256:<hex> revision (rollback-revision only)
        required: false
        type: string

concurrency:
  group: publish-hermes-v2
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_DEFAULT_OUTPUT: ${{ secrets.AWS_DEFAULT_OUTPUT }}
      R2_ENDPOINT: https://36b6c4744ccceb0acf36d8951bb741ab.r2.cloudflarestorage.com
      R2_BUCKET: ffxiv-hermes
      V2_PUBLIC_BASE_URL: https://hermes.sapphosound.com/v2
    steps:
      - name: Checkout Hermes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Require current main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main || {
            echo "Hermes v2 rollback must be dispatched from main." >&2
            exit 1
          }
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || {
            echo "The selected workflow revision is not the current main head." >&2
            exit 1
          }

      - name: Resolve rollback revision
        id: target
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          REQUESTED_REVISION: ${{ inputs.rollback_revision }}
        run: |
          set -euo pipefail
          current_revision="$(jq -r '.resourceRevision' v2/latest.json)"
          if [[ "$MODE" == rollback-revision ]]; then
            revision="$REQUESTED_REVISION"
            [[ "$revision" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "rollback_revision must be sha256:<64 lowercase hex>." >&2
              exit 1
            }
          else
            revision="$(
              git log -p --format= -- v2/latest.json \
                | sed -n 's/^[-+] *\"resourceRevision\": \"\\(sha256:[0-9a-f]\\{64\\}\\)\",/\\1/p' \
                | awk -v current="$current_revision" '$0 != current { print; exit }'
            )"
            [[ "$revision" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Could not resolve the preceding production revision from git history." >&2
              exit 1
            }
          fi
          test "$revision" != "$current_revision" || {
            echo "Rollback target is already current." >&2
            exit 1
          }
          digest="${revision#sha256:}"
          manifest="v2/manifests/$digest.json"
          test -f "$manifest" || {
            echo "Rollback manifest is not recorded in git: $revision" >&2
            exit 1
          }
          mkdir -p rollback-v2
          cp "$manifest" rollback-v2/manifest.json
          dotnet build tools/Hermes.V2.Generator/Hermes.V2.Generator.csproj -c Release
          calculated="$(dotnet run --project tools/Hermes.V2.Generator -c Release --no-build -- \
            validate --manifest rollback-v2/manifest.json --schema schemas/hermes-v2.schema.json)"
          test "$revision" = "$calculated"
          status="$(jq -r '.validation.status' rollback-v2/manifest.json)"
          [[ "$status" == generated || "$status" == live-verified ]]
          fcs_commit="$(jq -r '.source.fcsCommit' rollback-v2/manifest.json)"
          jq -n \
            --arg revision "$revision" \
            --arg manifest "manifests/$revision.json" \
            --arg fcsCommit "$fcs_commit" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:2,resourceRevision:$revision,manifest:$manifest,fcsCommit:$fcsCommit,publishedAt:$publishedAt}' \
            > rollback-v2/latest.json
          printf '%s\n' "$revision" > rollback-v2/revision.txt

      - name: Verify immutable manifest read-back
        shell: bash
        run: |
          set -euo pipefail
          revision="$(cat rollback-v2/revision.txt)"
          aws s3api get-object \
            --bucket "$R2_BUCKET" \
            --key "v2/manifests/$revision.json" \
            --endpoint-url "$R2_ENDPOINT" \
            rollback-v2/readback.json >/dev/null
          cmp --silent rollback-v2/manifest.json rollback-v2/readback.json

      - name: Record rollback in git
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || {
            echo "main advanced while resolving rollback; refusing stale rollback." >&2
            exit 1
          }
          cp rollback-v2/latest.json v2/latest.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/latest.json
          git commit -m "Roll back Hermes v2 to $(cat rollback-v2/revision.txt | cut -c8-19)"
          git push origin HEAD:main

      - name: Publish rollback pointer
        shell: bash
        run: |
          set -euo pipefail
          aws s3api put-object \
            --bucket "$R2_BUCKET" \
            --key v2/latest.json \
            --body rollback-v2/latest.json \
            --content-type application/json \
            --cache-control "public,max-age=0,s-maxage=60,must-revalidate" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null

      - name: Allow runner through Cloudflare
        uses: xiaotianxt/bypass-cloudflare-for-github-action@0c44a8bb3b1c9d370e48be2becf88ef33de8d57e # v2.1.0
        with:
          cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          cf_zone_id: ${{ secrets.CF_ZONE_ID }}
          cf_api_token: ${{ secrets.CF_API_TOKEN }}
          disable_bot_fight_mode: "true"

      - name: Verify public endpoint
        shell: bash
        run: |
          set -euo pipefail
          revision="$(cat rollback-v2/revision.txt)"
          base="${V2_PUBLIC_BASE_URL%/}"
          curl_args=(
            --ipv4
            --fail
            --silent
            --show-error
            --max-time 15
            --header "Accept: application/json"
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127.0.0.0 Safari/537.36"
          )
          for attempt in {1..13}; do
            if curl "${curl_args[@]}" "$base/latest.json?revision=${revision#sha256:}" \
              -o rollback-v2/public-latest.json \
              && cmp --silent rollback-v2/latest.json rollback-v2/public-latest.json; then
              break
            fi
            if [[ "$attempt" == 13 ]]; then
              echo "Public latest did not converge to $revision within 120 seconds." >&2
              exit 1
            fi
            sleep 10
          done
          curl --retry 12 --retry-all-errors --retry-delay 10 \
            "${curl_args[@]}" \
            "$base/manifests/$revision.json?revision=${revision#sha256:}" \
            -o rollback-v2/public-manifest.json
          cmp --silent rollback-v2/manifest.json rollback-v2/public-manifest.json
